AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FlyWorkFlow backend — NestJS API packaged as a Lambda container image,
  fronted by API Gateway (HTTP API). Guided real deploy is Phase 6
  (roadmap.md); see the owner's personal aws-deploy-guide.md (not
  versioned) for that walkthrough. This iteration (F3.5) only validates
  the template locally with `sam build` + `sam local start-api`.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ''
    Description: PostgreSQL (Railway in production) connection string.
  JwtAccessSecret:
    Type: String
    NoEcho: true
    Default: ''
    # Renamed from the original `JwtSecret`/`JWT_SECRET` (F4.1) to match the
    # env var the app actually reads (JwtStrategy/AuthModule/AuthService) —
    # the old name would have silently 401'd every request on a real deploy.
    Description: Secret used to sign JWT access tokens (wired in F4.1).
  JwtAccessExpiresInSeconds:
    Type: String
    Default: '900'
  JwtRefreshExpiresInDays:
    Type: String
    Default: '7'
  S3PresignedUrlExpiresInSeconds:
    Type: String
    Default: '300'
    Description: How long a presigned media upload URL stays valid (F5.5).
  FrontendOrigin:
    Type: String
    Default: 'http://localhost:3000'
    Description: >
      Allowed CORS origin for both the API (backend CORS/helmet setup) and
      the MediaBucket's PUT CORS rule — the deployed Vercel URL in
      production (F6.3). Never '*'.
  MaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    Description: >
      Hard ceiling on simultaneously running Lambda instances (F9.4). Two
      separate limits depend on it. Postgres: every cold start can open its
      own connection, and Railway's free tier runs out of them long before
      Lambda's default account-wide concurrency of 1000 would (roadmap.md
      §Risks). Rate limiting: `@nestjs/throttler` counts in each instance's
      own memory, with no shared store, so the API's real ceiling is
      APP_THROTTLE_LIMIT x running instances — unbounded concurrency means an
      unbounded rate limit, and this is what turns it back into a number.
  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Address subscribed to the alarm topic (F9.3). Optional: with it empty the
      alarms are still created and still change state in the console, only the
      email notification is skipped — so a deploy that forgets it degrades to
      "no notification", never to "no alarm".

Conditions:
  # SNS rejects an empty Endpoint, so the subscription (not the topic, and not
  # the alarms) is what gets conditioned out.
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    # Generous for a cold NestJS+Prisma start (requirements.md §2 accepts
    # Lambda cold starts for a portfolio project); real AWS cold starts run
    # well under this, this headroom is mainly for slow local Docker runs.
    Timeout: 30
    MemorySize: 512

Resources:
  # Media attachments (F5.5). Access is always via presigned URLs from the
  # backend, never a public bucket policy — see aws-deploy-guide.md §8.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref FrontendOrigin]
            AllowedHeaders: ['*']

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          JWT_ACCESS_SECRET: !Ref JwtAccessSecret
          JWT_ACCESS_EXPIRES_IN_SECONDS: !Ref JwtAccessExpiresInSeconds
          JWT_REFRESH_EXPIRES_IN_DAYS: !Ref JwtRefreshExpiresInDays
          S3_BUCKET_NAME: !Ref MediaBucket
          S3_PRESIGNED_URL_EXPIRES_IN_SECONDS: !Ref S3PresignedUrlExpiresInSeconds
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          NODE_ENV: production
          # AWS_REGION is a reserved Lambda runtime variable — it's already
          # set automatically, SAM would reject an explicit override here.
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

  # Explicit so retention can be set (F6.3) — without this, SAM's
  # implicitly-created log group for BackendFunction has no retention and
  # accumulates cost indefinitely even though ingestion itself stays free
  # (best-practices.md §AWS SAM / CI-CD). The name must match the
  # auto-created one exactly for CloudFormation to treat this as the same
  # resource instead of erroring on a duplicate.
  BackendFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${BackendFunction}
      RetentionInDays: 14

  # --- Observability (F9.3) ---------------------------------------------
  # Three alarms, because no single metric sees every way this API can fail:
  #
  #   Lambda Errors     — the function never returned: init crash, unhandled
  #                       rejection, timeout, out of memory. AllExceptionsFilter
  #                       can't catch any of these, so nothing reaches the logs.
  #   API Gateway 5xx   — what the browser actually got, including the failures
  #                       where Lambda was never invoked (integration errors,
  #                       throttling at the account concurrency ceiling).
  #   Application 5xx   — counted off the JSON log lines the filter writes, the
  #                       only one of the three that is a *handled* 500 with a
  #                       requestId and a route already attached to go debug.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: FlyWorkFlow backend alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlarmTopic

  # `notBreaching` on all three: no traffic is the normal state of a portfolio
  # API, and INSUFFICIENT_DATA on an idle stack trains you to ignore the alarm.
  BackendFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-errors'
      AlarmDescription: >
        The Lambda itself failed (crash, timeout, OOM) — no application log
        line explains these, check the REPORT/Init lines in the log group.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  HttpApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-apigw-5xx'
      AlarmDescription: >
        API Gateway returned a 5xx to a client, whatever the cause.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        # The implicit HTTP API SAM creates from the function's events; the
        # same logical id the ApiUrl output already resolves.
        - Name: ApiId
          Value: !Ref ServerlessHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Reads the `statusCode` field of the JSON lines AllExceptionsFilter emits
  # (JsonLogger, production only) — this is what makes the structured logging
  # load-bearing rather than decorative. A JSON metric filter only matches log
  # events that parse as JSON on their own, which is why JsonLogger writes one
  # object per line straight to stdout and never through `console.log`.
  ApplicationServerErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendFunctionLogGroup
      FilterPattern: '{ $.statusCode >= 500 }'
      MetricTransformations:
        - MetricNamespace: FlyWorkFlow/Backend
          MetricName: ApplicationServerErrors
          MetricValue: '1'
          DefaultValue: 0

  ApplicationServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-app-5xx'
      AlarmDescription: >
        A request failed inside the app. Find it with, in Logs Insights:
        fields @timestamp, requestId, route, error
        | filter statusCode >= 500 | sort @timestamp desc
      Namespace: FlyWorkFlow/Backend
      MetricName: ApplicationServerErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (dev stage)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  MediaBucketName:
    Description: SAM-generated S3 bucket name for incident media attachments
    Value: !Ref MediaBucket
  AlarmTopicArn:
    Description: >
      SNS topic the 5xx alarms publish to (F9.3). Subscribe by redeploying with
      AlarmEmail set, not by adding a subscription by hand in the console.
    Value: !Ref AlarmTopic
