name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `vercel pull` resolves which project it is talking to from
    # `.vercel/project.json` — written by `vercel link` on a developer machine,
    # and gitignored, because it is per-checkout state rather than project
    # configuration. A CI runner therefore has no link at all, and the CLI's
    # documented substitute is this pair of environment variables. Without
    # them the very first Vercel step fails before anything is compiled, which
    # is a different failure from an invalid token and looks much the same in
    # the log. Both IDs come from the Vercel project's Settings > General
    # ("Project ID") and the team/account settings ("Team ID"); neither is a
    # secret in the credential sense, but they are stored as repository
    # secrets alongside the token so the deploy has one place to configure.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # Build-time env comes from the pulled production environment, so
      # NEXT_PUBLIC_MEDIA_HOST (F9.6) has to be set on the Vercel project
      # itself, not here — it is inlined into the bundle at build time, and
      # `next/image` rejects every gallery tile whose host is not in
      # next.config.mjs's remotePatterns. Its value is the backend stack's
      # `MediaBucketHost` output.
      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
