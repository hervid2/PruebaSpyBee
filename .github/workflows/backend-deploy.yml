name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

defaults:
  run:
    working-directory: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # F9.6. Migrations run here because nothing else in the pipeline ever ran
      # them: `sam deploy` only replaces the Lambda image, and the image itself
      # cannot migrate — the runtime stage of the Dockerfile copies `dist`,
      # `node_modules` and `package.json`, so `prisma/migrations` is not even
      # in it. Every migration up to F9.5 was applied by hand from a developer
      # machine, which worked only for as long as nobody forgot.
      #
      # F9.5 is what made forgetting fatal rather than untidy: it adds columns
      # to `User`, and the generated client selects every scalar field, so a
      # new image against an un-migrated database answers P2022 to any query
      # touching a user — login, /users/me, the JWT strategy. The whole API.
      #
      # Before `sam deploy`, deliberately. Prisma migrations here are additive
      # (new nullable columns, a new unique index), so the old image keeps
      # working against the new schema for the minutes between the two steps,
      # while the reverse order leaves the new image talking to the old schema
      # — the outage described above. A destructive migration would need the
      # expand/contract split instead, and must not simply be dropped in here.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (for the Prisma CLI)
        run: npm ci
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - uses: aws-actions/setup-sam@v2

      - name: sam build
        run: sam build

      # samconfig.toml (versioned) supplies stack_name/region/capabilities/
      # image_repositories — no --guided, no --resolve-image-repos needed.
      # NoEcho params (DatabaseUrl/JwtAccessSecret) are never saved there by
      # design (aws-deploy-guide.md §7), and FrontendOrigin was left at its
      # template default during the guided run — so all three, plus the three
      # that ARE already in samconfig.toml, are passed explicitly here to avoid
      # CLI --parameter-overrides silently dropping the latter.
      #
      # The overrides are assembled in the shell rather than interpolated into
      # the command line, which is what kept this job red from F9.3 until now.
      # `AlarmEmail="${{ secrets.ALARM_EMAIL }}"` with the secret unset became
      # the bare token `AlarmEmail=` once bash stripped the quotes, and the SAM
      # CLI rejects an empty value outright:
      #
      #   Invalid value for '--parameter-overrides': AlarmEmail= is not a
      #   valid format.
      #
      # It never reached AWS — hence a one-second failure and a stack that
      # recorded no update attempt, which reads exactly like a permissions
      # problem and is not one. `AlarmEmail` is optional by design (F9.3: unset
      # means create the alarms, skip the email subscription), and that is a
      # property of the *template*; the CLI has no way to express it, so the
      # parameter has to be omitted rather than passed empty.
      #
      # Secrets travel through `env` for the same reason: interpolating them
      # into the command line re-quotes them through bash, so a `$`, a quote or
      # a backtick in a generated password breaks the argument list.
      - name: sam deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: |
          # Required: an empty one here is a misconfiguration worth stopping
          # for, and stopping with a name beats SAM's parse error.
          for required in DATABASE_URL JWT_SECRET FRONTEND_ORIGIN; do
            if [ -z "${!required}" ]; then
              echo "::error::Secret $required is empty; cannot deploy." >&2
              exit 1
            fi
          done

          overrides=(
            "DatabaseUrl=$DATABASE_URL"
            "JwtAccessSecret=$JWT_SECRET"
            "FrontendOrigin=$FRONTEND_ORIGIN"
            "JwtAccessExpiresInSeconds=900"
            "JwtRefreshExpiresInDays=7"
            "S3PresignedUrlExpiresInSeconds=300"
            "S3PresignedDownloadExpiresInSeconds=1800"
          )

          # Optional: omitted entirely when unset, so the template's
          # HasAlarmEmail condition sees its own default.
          if [ -n "$ALARM_EMAIL" ]; then
            overrides+=("AlarmEmail=$ALARM_EMAIL")
          else
            echo "ALARM_EMAIL is unset: alarms will be created without an email subscription."
          fi

          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset             --parameter-overrides "${overrides[@]}"
