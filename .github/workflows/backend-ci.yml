name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

env:
  # Test-only value — JwtStrategy/JwtModule need it at module-init time even
  # though these jobs never touch a real database. Never the real secret,
  # which only ever lives as a SAM NoEcho parameter (F6.2).
  JWT_ACCESS_SECRET: ci-test-only-secret-do-not-use-in-prod
  # Kept equal to ci.yml's NODE_VERSION (F9.5). Two workflows cannot share one
  # variable without a repository-level setting, so this is a duplicate on
  # purpose — change both together.
  NODE_VERSION: '22'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # F9.4 — `best-practices.md §Security` asks for `npm audit` in CI on
      # both halves of the project, and neither pipeline had it. `high` is the
      # gate rather than `critical`: the backend tree is clean today, so
      # anything that trips this is something a `npm audit fix` introduced or
      # a new advisory landed on, and it is worth stopping for.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --coverage
      - run: npm run test:e2e
      - run: npm run build
