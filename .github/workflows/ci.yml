name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Single source of truth for the Node version across both jobs (F9.5). The
# quality job used to pin 20 while the e2e job below and backend-ci.yml were on
# 22, so "passes CI" meant two different runtimes depending on which job you
# were reading — and the one that ran `npm run build` was not the one that ran
# the built app.
env:
  NODE_VERSION: '22'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # F9.4 — the `npm audit` step `best-practices.md §Security` asks for and
      # neither pipeline had. Always printed in full, so the whole list is in
      # the job log whatever the gate does with it.
      - name: Audit dependencies (report)
        run: npm audit || true
      # Gated at `critical`, not `high` like backend-ci.yml, and deliberately:
      # the five highs open today are all transitive under next@14 (postcss,
      # glob, and next itself), and npm's only offered fix is next@16 — a
      # framework major, not a patch. A gate set to `high` would be red from
      # the day it was added, which is a gate nobody reads. Lower this to
      # `high` as part of that upgrade.
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --coverage
      - run: npm run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    # F7.5: the e2e specs exercise the real incidents/auth API (Phase 7), not
    # a static mock — an ephemeral Postgres + a real backend instance replace
    # what used to be a frontend-only job. This is also why `paths-ignore:
    # backend/**` is gone from the triggers above: a backend-only change can
    # now break this suite too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flyworkflow
          POSTGRES_PASSWORD: flyworkflow
          POSTGRES_DB: flyworkflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Shared between the ephemeral backend and the frontend build/test run:
      # middleware.ts verifies the access token's signature at the Edge with
      # this same secret (roadmap.md Phase 7 decision #2) — never the real
      # secret, which only ever lives as a SAM NoEcho parameter (F6.2).
      JWT_ACCESS_SECRET: ci-test-only-secret-do-not-use-in-prod
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ── Ephemeral backend ──────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply migrations and seed the ephemeral database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://flyworkflow:flyworkflow@localhost:5432/flyworkflow?schema=public
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Start backend and wait for /health
        working-directory: backend
        env:
          DATABASE_URL: postgresql://flyworkflow:flyworkflow@localhost:5432/flyworkflow?schema=public
          PORT: 3001
          JWT_ACCESS_EXPIRES_IN_SECONDS: 900
          JWT_REFRESH_EXPIRES_IN_DAYS: 7
          # Never actually exercised by these specs (no test attaches media),
          # just needs to be present — S3StorageProvider's constructor
          # requires both at boot (getOrThrow).
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: ci-placeholder-bucket
          FRONTEND_ORIGIN: http://localhost:3000
        run: |
          node dist/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready in time" >&2
          exit 1

      # ── Frontend + e2e ──────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci
      - run: npx playwright install --with-deps
      # Se construye SIN token de Mapbox a propósito: en CI el WebGL por software
      # (swiftshader) hace que inicializar mapas reales sature la CPU y dispare el
      # tiempo del job. Sin token, los componentes de mapa renderizan un fallback
      # ligero (ver guards en useMapbox, HeatmapSection y LocationPicker) y los E2E
      # —que no verifican el mapa— corren de forma rápida y determinista.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
